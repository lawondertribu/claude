<!DOCTYPE html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(120% 80% at 50% 20%, #3b0764 0%, #0a0a0a 70%);
      }
      /* Zone sûre Reels : on évite ~250px en haut et ~420px en bas (UI Instagram) */
      .scene {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 250px;
        bottom: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 40px;
        color: #fafafa;
      }
      .hook {
        font-size: 120px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }
      .accent {
        color: #f472b6;
      }
      .body {
        font-size: 64px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      .cta {
        display: inline-block;
        font-size: 56px;
        font-weight: 700;
        padding: 32px 64px;
        border-radius: 999px;
        background: #f472b6;
        color: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qv3y" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <h1 data-hf-id="hf-2uzh" id="hook" class="scene hook clip" data-start="0" data-duration="5" data-track-index="0"><span data-hf-id="hf-x4vp">Ton <span data-hf-id="hf-b9z4" class="accent">hook</span> ici</span></h1>
      <p data-hf-id="hf-zo0g" id="message" class="scene body clip" data-start="5" data-duration="5" data-track-index="1">Le message principal de ton Reel, en une ou deux phrases.</p>
      <p data-hf-id="hf-mvev" id="cta-text" class="scene body clip" data-start="10" data-duration="5" data-track-index="2" style="justify-content: flex-start; padding-top: 420px">Envie d'en voir plus ?</p>
      <div data-hf-id="hf-g1f2" id="cta" class="scene clip" data-start="10.4" data-duration="4.6" data-track-index="3"><span data-hf-id="hf-xuqf" class="cta">Abonne-toi ✨</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook", { opacity: 0, y: 80, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.2);
      tl.to("#hook", { opacity: 0, y: -60, duration: 0.4 }, 4.5);
      tl.fromTo("#message", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.2);
      tl.to("#message", { opacity: 0, duration: 0.4 }, 9.5);
      tl.fromTo("#cta-text", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5 }, 10.2);
      tl.fromTo("#cta .cta", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 10.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
